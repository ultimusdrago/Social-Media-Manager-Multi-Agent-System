[project]
name = "social-media-manager"
version = "0.1.0"
description = "Multi-agent social content pipeline (research → draft → QA) with CrewAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.12",
    "crewai-tools>=1.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tavily-python>=0.7.23",
    "typer>=0.12",
]

[project.scripts]
smm-crew = "social_media_manager.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["social_media_manager"]
